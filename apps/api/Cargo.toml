[package]
name = "supellex-api"
version = "0.1.0"
edition = "2024"
description = "Gestionnaire de parc informatique (ITAM) avec IPAM - API"
license = "MIT"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tokio = { version = "1.54.1", features = ["full"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "ipnetwork", "migrate", "macros", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.6.0"
password-hash = "0.6.1"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
# getrandom est tiré transitivement par password-hash pour le sel argon2id
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-full", "limit", "timeout", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ipnet = "2.12.2"
ipnetwork = "0.21"
thiserror = "2.0.21"
validator = { version = "0.21.0", features = ["derive"] }
dotenvy = "0.15.7"
tower = { version = "0.5.3", features = ["util"] }
# Appareils réseau (VyOS / Cisco / MikroTik) : SSH (russh), chiffrement des
# secrets au repos (AES-256-GCM), API RouterOS maison (TCP, sans dep).
# Sans la feature "rsa" (conflit rsa 0.10.0-rc vs jsonwebtoken) : clés SSH
# ed25519/ECDSA + mot de passe. Les clés RSA clientes ne sont pas décodées.
russh = { version = "0.65", default-features = false, features = ["flate2", "aws-lc-rs"] }
aes-gcm = "0.11"
base64 = "0.23"
rand_core = { version = "0.6", features = ["getrandom"] }
# Sources d'auth externes : LDAP (rustls, pur Rust) et OIDC (authorization code
# + PKCE, vérification id_token via JWKS). Versions stables vérifiées à l'ajout.
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }

[dev-dependencies]
# tests d'intégration via la logique pure uniquement (pas de DB de test ici)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
